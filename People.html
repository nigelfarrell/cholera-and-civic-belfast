<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>People | Cholera & Civic Belfast</title>

<style>
body {
    font-family: Georgia, serif;
    background-color: #f4f1e8;
    margin: 0;
    color: #1f1f1f;
    line-height: 1.7;
}

/* HEADER */
header {
    text-align: center;
    padding: 50px 20px 20px;
    background: #2f4f3e;
    color: #f4f1e8;
}

h1 {
    font-size: 2.2em;
    margin: 0;
}

/* NAV */
.main-nav {
    margin-top: 25px;
}

.menu {
    list-style: none;
    padding: 0;
    margin: 0;

    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.menu > li {
    position: relative;
}

.menu a {
    color: #f4f1e8;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.95em;
}

/* DROPDOWN */
.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #f4f1e8;
    min-width: 180px;
    border: 1px solid #d8d2c3;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    padding: 10px 0;
    z-index: 999;
}

.dropdown-content li { list-style: none; }

.dropdown-content a {
    color: #2f4f3e;
    padding: 8px 15px;
    display: block;
    font-size: 0.9em;
}

.dropdown:hover .dropdown-content {
    display: block;
}

/* PEOPLE GRID (UNCHANGED) */
.people-grid {
    max-width: 600px;
    margin: 40px auto 60px auto;
    padding: 0 20px;

    display: flex;
    flex-direction: column;
    gap: 25px;
    align-items: center;
}

.person-card {
    text-decoration: none;
    text-align: center;
    width: 100%;
}

.person-img {
    width: 150px;
    height: 190px;
    margin: 0 auto;
    border-radius: 50% / 42%;
    background-color: #cfd8e3;
    border: 2px solid #2f4f3e;
    background-size: cover;
    background-position: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.person-card:hover .person-img {
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}

.person-title {
    margin-top: 10px;
    font-weight: bold;
    color: #2f4f3e;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 50px 20px;
    border-top: 1px solid #d8d2c3;
    color: #555;
}

/* MOBILE NAV */
@media (max-width: 768px) {

    .menu {
        flex-direction: column;
        gap: 0;
        align-items: center;
    }

    .menu > li {
        width: 100%;
        text-align: center;
        border-top: 1px solid rgba(244,241,232,0.2);
    }

    .menu a {
        display: block;
        padding: 12px;
    }

    .dropdown:hover .dropdown-content {
        display: none;
    }

    .dropdown-content {
        position: static;
        display: none;
        background: #f4f1e8;
        box-shadow: none;
        border: none;
    }

    .dropdown.open .dropdown-content {
        display: block;
    }
}
</style>
</head>

<body>

<header>

<h1>People</h1>

<nav class="main-nav">
<ul class="menu">

<li><a href="index.html">Home</a></li>

<li class="dropdown">
<a href="People.html">People</a>
<ul class="dropdown-content">
<li><a href="people/malcolm.html">Dr Andrew G. Malcolm</a></li>
<li><a href="#">Doctors</a></li>

</ul>
</li>

<li class="dropdown">
<a href="#">Cholera</a>
<ul class="dropdown-content">
<li><a href="#">1832</a></li>
<li><a href="#">1849</a></li>
<li><a href="#">1854</a></li>
<li><a href="#">1866</a></li>
</ul>
</li>

<li class="dropdown">
<a href="#">Public Health</a>
<ul class="dropdown-content">
<li><a href="#">Water Supply</a></li>
<li><a href="#">Sanitation</a></li>
<li><a href="#">Civic Reform</a></li>
</ul>
</li>

<li><a href="Blog.html">Blog</a></li>
<li><a href="#">Sources</a></li>

</ul>
</nav>

</header>

<div class="people-grid">

<a href="people/malcolm.html" class="person-card">
<div class="person-img" style="background-image:url('images/malcolm.png')"></div>
<div class="person-title">Dr Andrew George Malcolm</div>
</a>

<a href="#" class="person-card"><div class="person-img"></div></a>
<a href="#" class="person-card"><div class="person-img"></div></a>
<a href="#" class="person-card"><div class="person-img"></div></a>

</div>

<footer>
<p>© Cholera & Civic Belfast</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const dropdowns = document.querySelectorAll(".dropdown > a");
    dropdowns.forEach(link => {
        link.addEventListener("click", function (e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                this.parentElement.classList.toggle("open");
            }
        });
    });
});
</script>

</body>
</html>
