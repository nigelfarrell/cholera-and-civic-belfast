<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>People | Cholera & Civic Belfast</title>

<style>
body {
    font-family: Georgia, serif;
    background-color: #f4f1e8;
    margin: 0;
    color: #1f1f1f;
}

header {
    text-align: center;
    padding: 50px 20px;
    background: #2f4f3e;
    color: #f4f1e8;
}

a {
    text-decoration: none;
    color: inherit;
}

/* GRID */
.people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 30px;
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
}

/* CARD */
.person-card {
    text-align: center;
}

/* OVAL IMAGE */
.person-img {
    width: 140px;
    height: 180px;
    margin: 0 auto 10px;
    border-radius: 50% / 40%;
    background-color: #cfd8e3;
    border: 2px solid #2f4f3e;
    background-size: cover;
    background-position: center;
    transition: transform 0.2s ease;
}

.person-card:hover .person-img {
    transform: scale(1.05);
}

.person-title {
    font-weight: bold;
    color: #2f4f3e;
}
</style>
</head>

<body>

<header>
    <h1>People</h1>
</header>

<div class="people-grid">

    <a href="people/malcolm.html" class="person-card">
        <div class="person-img"
             style="background-image:url('images/malcolm.png')"></div>
        <div class="person-title">Dr Andrew G. Malcolm</div>
    </a>

    <a href="people/reformer1.html" class="person-card">
        <div class="person-img"></div>
        <div class="person-title">Civic Reformer</div>
    </a>

    <a href="people/doctor1.html" class="person-card">
        <div class="person-img"></div>
        <div class="person-title">Medical Officer</div>
    </a>

    <a href="people/engineer1.html" class="person-card">
        <div class="person-img"></div>
        <div class="person-title">City Engineer</div>
    </a>

    <a href="people/administrator1.html" class="person-card">
        <div class="person-img"></div>
        <div class="person-title">Administrator</div>
    </a>

    <a href="people/nurse1.html" class="person-card">
        <div class="person-img"></div>
        <div class="person-title">Nursing Figure</div>
    </a>

</div>

</body>
</html>
