<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>People | Cholera & Civic Belfast</title>

<style>
body {
    font-family: Georgia, serif;
    background-color: #f4f1e8;
    margin: 0;
    color: #1f1f1f;
}

header {
    text-align: center;
    padding: 50px 20px;
    background: #2f4f3e;
    color: #f4f1e8;
}

a {
    text-decoration: none;
    color: inherit;
}

/* GRID */
.people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 30px;
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
}

/* OVAL IMAGE */
.person-img {
    width: 140px;
    height: 180px;
    margin: 0 auto;
    border-radius: 50% / 40%;
    background-color: #cfd8e3;
    border: 2px solid #2f4f3e;
    background-size: cover;
    background-position: center;
    transition: transform 0.2s ease;
}

.person-card:hover .person-img {
    transform: scale(1.05);
}
</style>
</head>

<body>

<header>
    <h1>People</h1>
</header>

<div class="people-grid">

    <!-- ✔ KEEP MALCOLM -->
  <a href="people/malcolm.html" class="person-card">
    <div class="person-img"
         style="background-image:url('images/malcolm.png')"></div>

    <div class="person-title">
        Dr Andrew George Malcolm
    </div>
</a>
    </a>

    <!-- EMPTY SLOTS (future people) -->
    <a href="#" class="person-card">
        <div class="person-img"></div>
    </a>

    </a>

        <div class="person-img"></div>
    </a>

    <a href="#" class="person-card">
        <div class="person-img"></div>
    </a>

</div>

</body>
</html>
