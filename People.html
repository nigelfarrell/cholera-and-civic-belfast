<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>People | Cholera & Civic Belfast</title>

<style>
body {
    font-family: Georgia, serif;
    background-color: #f4f1e8;
    margin: 0;
    color: #1f1f1f;
    line-height: 1.7;
}

/* HEADER */
header {
    text-align: center;
    padding: 50px 20px 20px;
    background: #2f4f3e;
    color: #f4f1e8;
}

h1 {
    margin: 0;
    font-size: 2.2em;
}

.subtitle {
    font-style: italic;
    margin-top: 10px;
    color: #e8e2d3;
    font-size: 1em;
}

/* NAV */
nav {
    margin-top: 25px;
}

.menu {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.menu > li {
    position: relative;
}

.menu a {
    color: #f4f1e8;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.95em;
    transition: color 0.2s ease;
}

.menu a:hover {
    color: #e8e2d3;
}

/* DROPDOWNS CORE */
.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #f4f1e8;
    border: 1px solid #d8d2c3;
    min-width: 240px;
    z-index: 999;
    padding: 10px 0;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}

.dropdown-content a {
    display: block;
    padding: 8px 15px;
    color: #2f4f3e;
    text-decoration: none;
    font-weight: normal;
    transition: background 0.2s ease;
}

.dropdown-content a:hover {
    background: #e8e2d3;
    color: #1f4f3e;
}

.menu > li.dropdown:hover > .dropdown-content {
    display: block;
}

/* PEOPLE GRID */
.people-grid {
    max-width: 600px;
    margin: 40px auto 60px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    align-items: center;
}

.person-card {
    text-decoration: none;
    text-align: center;
    width: 100%;
}

.person-img {
    width: 150px;
    height: 190px;
    margin: 0 auto;
    border-radius: 50% / 42%;
    background-color: #cfd8e3;
    border: 2px solid #2f4f3e;
    background-size: cover;
    background-position: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.person-card:hover .person-img {
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}

.person-title {
    margin-top: 10px;
    font-weight: bold;
    color: #2f4f3e;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 50px 20px;
    border-top: 1px solid #d8d2c3;
    color: #555;
    font-size: 0.9em;
}

footer a {
    color: #555;
    text-decoration: none;
    border-bottom: 1px dotted #bbb;
}

footer a:hover {
    color: #2f4f3e;
    border-bottom-color: #2f4f3e;
}

/* MOBILE */
@media (max-width: 768px) {

    .menu {
        flex-direction: column;
        align-items: center;
        gap: 0;
    }

    .menu > li {
        width: 100%;
        text-align: center;
    }

    .dropdown-content {
        position: static;
        display: none;
        border: none;
        box-shadow: none;
        background: #e8e2d3;
        margin-top: 5px;
    }

    .dropdown:hover .dropdown-content {
        display: none;
    }

    .dropdown.open .dropdown-content {
        display: block;
    }
}
</style>
</head>

<body>

<header>

<h1>Cholera & Civic Belfast</h1>

<div class="subtitle">
Stories of Disease, Public Health and Everyday Life in Nineteenth-Century Belfast
</div>

<nav>
    <div id="menu-container"></div>
</nav>

<script>
    fetch('nav.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('menu-container').innerHTML = data;
        })
        .catch(error => console.error('Error loading menu:', error));
</script>
</header>

<div class="people-grid">

<a href="people/malcolm.html" class="person-card">
<div class="person-img" style="background-image:url('images/malcolm.png')"></div>
<div class="person-title">Dr Andrew George Malcolm</div>
</a>

<a href="#" class="person-card"><div class="person-img"></div></a>
<a href="#" class="person-card"><div class="person-img"></div></a>
<a href="#" class="person-card"><div class="person-img"></div></a>

</div>

<footer>
<p>© Cholera & Civic Belfast — Dr Nigel Farrell</p>
<p><a href="licence.html">Copyright & Licence</a></p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const dropdowns = document.querySelectorAll(".dropdown > a");

    dropdowns.forEach(link => {
        link.addEventListener("click", function (e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                this.parentElement.classList.toggle("open");
            }
        });
    });
});
</script>

</body>
</html>
