<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog | Cholera & Civic Belfast</title>

<style>
body {
    font-family: Georgia, serif;
    background-color: #f4f1e8;
    margin: 0;
    color: #1f1f1f;
    line-height: 1.7;
}

/* HEADER */
header {
    text-align: center;
    padding: 50px 20px 20px;
    background: #2f4f3e;
    color: #f4f1e8;
}

h1 { margin: 0; font-size: 2.2em; }

/* NAV */
.main-nav { margin-top: 25px; }

.menu {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    padding: 0;
    margin: 0;
}

.menu > li { position: relative; }

.menu a {
    color: #f4f1e8;
    text-decoration: none;
    font-weight: bold;
}

/* DROPDOWN */
.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #f4f1e8;
    min-width: 180px;
    border: 1px solid #d8d2c3;
}

.dropdown-content a {
    display: block;
    padding: 8px 15px;
    color: #2f4f3e;
}

.dropdown:hover .dropdown-content {
    display: block;
}

/* BLOG LAYOUT (UNCHANGED STRUCTURE) */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.article {
    background: #faf8f3;
    border: 1px solid #d8d2c3;
    margin-bottom: 30px;
    padding: 20px;
}

.article-flex {
    display: flex;
    gap: 20px;
}

.article-flex img {
    width: 40%;
    object-fit: contain;
    border: 1px solid #d8d2c3;
}

.article-text {
    width: 60%;
}

/* MOBILE */
@media (max-width: 768px) {

    .menu { flex-direction: column; }

    .dropdown:hover .dropdown-content { display: none; }

    .dropdown-content {
        position: static;
        display: none;
        border: none;
    }

    .dropdown.open .dropdown-content {
        display: block;
    }

    .article-flex {
        flex-direction: column;
    }

    .article-flex img,
    .article-text {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>

<h1>Blog</h1>

<nav class="main-nav">
<ul class="menu">

<li><a href="index.html">Home</a></li>
<li><a href="People.html">People</a></li>
<li><a href="#">Cholera</a></li>
<li><a href="#">Public Health</a></li>
<li><a href="Blog.html">Blog</a></li>
<li><a href="#">Sources</a></li>

</ul>
</nav>

</header>

<div class="container">

<div class="article">
<div class="article-flex">
<img src="images/cholera-1832-blog.jpg">
<div class="article-text">
<h2>Cholera in Belfast 1832 and 1848</h2>
<p>Study of epidemics and reform.</p>
<a href="#">Read PDF</a>
</div>
</div>
</div>

<div class="article">
<div class="article-flex">
<img src="images/cholera-poster.jpg">
<div class="article-text">
<h2>Cholera in Belfast</h2>
<p>Urban disease and sanitation reform.</p>
<a href="#">Read PDF</a>
</div>
</div>
</div>

</div>

<footer>
<p>© Cholera & Civic Belfast</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const dropdowns = document.querySelectorAll(".dropdown > a");
    dropdowns.forEach(link => {
        link.addEventListener("click", function (e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                this.parentElement.classList.toggle("open");
            }
        });
    });
});
</script>

</body>
</html>
