<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Title | Cholera & Civic Belfast</title>

<style>
/* ===== COPY YOUR EXISTING CSS FROM index.html OR Research.html HERE ===== */
/* Include all styles: body, header, nav, dropdowns, keyboard navigation, etc. */

body {
    font-family: Georgia, serif;
    background-color: #f4f1e8;
    margin: 0;
    color: #1f1f1f;
    line-height: 1.7;
}

/* HEADER */
header {
    text-align: center;
    padding: 50px 20px 20px;
    background: #2f4f3e;
    color: #f4f1e8;
}

h1 {
    margin: 0;
    font-size: 2.3em;
}

.subtitle {
    font-style: italic;
    margin-top: 10px;
    color: #e8e2d3;
    font-size: 1.1em;
}

/* NAV */
nav {
    margin-top: 25px;
}

.menu {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.menu > li {
    position: relative;
}

.menu a {
    color: #f4f1e8;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.95em;
    transition: color 0.2s ease;
}

.menu a:hover {
    color: #e8e2d3;
}

/* DROPDOWNS CORE */
.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #f4f1e8;
    border: 1px solid #d8d2c3;
    min-width: 240px;
    z-index: 999;
    padding: 10px 0;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}

.dropdown-content a {
    display: block;
    padding: 8px 15px;
    color: #2f4f3e;
    text-decoration: none;
    font-weight: normal;
    transition: background 0.2s ease;
}

.dropdown-content a:hover {
    background: #e8e2d3;
    color: #1f4f3e;
}

.menu > li.dropdown:hover > .dropdown-content {
    display: block;
}

/* KEYBOARD NAVIGATION - FOCUS INDICATORS */
.dropdown > a:focus {
    outline: 2px solid #e8e2d3;
    outline-offset: 4px;
    border-radius: 2px;
}

.dropdown-content a:focus {
    background: #e8e2d3;
    outline: none;
}

.dropdown:focus-within .dropdown-content {
    display: block;
}

/* CONTAINER */
.container {
    max-width: 950px;
    margin: auto;
    padding: 40px 20px;
}

/* PAGE TITLE */
.page-title {
    color: #2f4f3e;
    font-size: 2em;
    margin-top: 0;
    margin-bottom: 20px;
    border-left: 5px solid #2f4f3e;
    padding-left: 20px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 50px 20px;
    border-top: 1px solid #d8d2c3;
    margin-top: 60px;
    color: #555;
    font-size: 0.9em;
}

footer a {
    color: #555;
    text-decoration: none;
    border-bottom: 1px dotted #bbb;
}

footer a:hover {
    color: #2f4f3e;
    border-bottom-color: #2f4f3e;
}

/* MOBILE */
@media (max-width: 768px) {
    .menu {
        flex-direction: column;
        align-items: center;
        gap: 0;
    }

    .menu > li {
        width: 100%;
        text-align: center;
    }

    .dropdown-content {
        position: static;
        display: none;
        border: none;
        box-shadow: none;
        background: #e8e2d3;
        margin-top: 5px;
    }

    .dropdown:hover .dropdown-content {
        display: none;
    }

    .dropdown.open .dropdown-content {
        display: block;
    }

    .page-title {
        font-size: 1.6em;
        padding-left: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Cholera & Civic Belfast</h1>
    <div class="subtitle">
        Stories of Disease, Public Health and Everyday Life in Nineteenth-Century Belfast
    </div>

    <!-- JAVASCRIPT MENU LOADER (for root pages) -->
    <nav>
        <div id="menu-container"></div>
    </nav>

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading menu:', error));
    </script>
</header>

<div class="container">
    <!-- YOUR PAGE'S UNIQUE CONTENT GOES HERE -->
    <h1 class="page-title">Page Title</h1>
    <p>Your content...</p>
</div>

<footer>
    <p>© Cholera & Civic Belfast — Dr Nigel Farrell</p>
    <p><a href="licence.html">Copyright & Licence</a></p>
</footer>

</body>
</html>
