name: Generate Sitemap

on:
  push:
    branches: [ main ]

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Generate the sitemap
      uses: jakejarvis/sitemap-generator-action@v1
      with:
        base-url: https://choleraandcivicbelfast.com/
        path: ./
        exclude: >
          /404.html
          /nav.html
          /page-template.html
          /blog/article-template.html
          /images/
        include-pdf: true
        change-frequency: monthly
        priority: '0.8'

    - name: Commit and push the sitemap
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add sitemap.xml
        git diff --staged --quiet || git commit -m "Automated sitemap update"
        git push
